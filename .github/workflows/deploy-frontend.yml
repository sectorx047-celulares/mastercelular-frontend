name: Deploy Frontend to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'cliente/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PROJECT_NAME: mastercelular-frontend

jobs:
  quality-gate:
    name: Quality Gate (Build Verification)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cliente

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cliente/package-lock.json

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build frontend
        run: node build.js

      - name: Verify dist/ exists and has content
        run: |
          ls -la dist/
          test -f dist/index.html || (echo "❌ index.html not found in dist/" && exit 1)
          echo "✅ Build verification passed"

      - name: Check for broken HTML (basic validation)
        run: |
          if command -v npx >/dev/null 2>&1; then
            npx html-validate dist/**/*.html --formatter stylish || echo "⚠️ html-validate not installed, skipping"
          fi

  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: quality-gate
    defaults:
      run:
        working-directory: ./cliente

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cliente/package-lock.json

      - name: Install dependencies (if package.json exists)
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build frontend
        run: node build.js

      - name: Verify dist/ exists
        run: ls -la dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.PROJECT_NAME }}
          directory: ./cliente/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          wranglerVersion: '3'