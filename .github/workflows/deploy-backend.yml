name: Deploy Backend to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'mastercelular-api/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: write  # Needed for version bump + tag push
  id-token: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  quality-gate:
    name: Quality Gate (Lint, TypeCheck, Tests, Audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mastercelular-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for version bump

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mastercelular-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src --ext .ts --max-warnings 0
        continue-on-error: false

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Security audit (fail on high/critical)
        run: npm audit --audit-level=high

  deploy:
    name: Deploy Worker to Cloudflare
    runs-on: ubuntu-latest
    needs: quality-gate
    defaults:
      run:
        working-directory: ./mastercelular-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mastercelular-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ./mastercelular-api
          environment: production

      - name: Verify deployment
        run: |
          echo "✅ Backend deployed successfully!"
          echo "Health: https://mastercelular-api.<your-subdomain>.workers.dev/health"

      - name: Bump version & Create changelog entry
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "## [$VERSION] - $(date +%Y-%m-%d)" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### Fixed" >> CHANGELOG.md
          echo "- Automated patch release" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          git add package.json CHANGELOG.md
          git commit -m "chore: release v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --tags