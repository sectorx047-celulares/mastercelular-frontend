name: Preview Deploy Backend (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mastercelular-api/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  quality-gate:
    name: Quality Gate (Lint, TypeCheck, Tests, Audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mastercelular-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mastercelular-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src --ext .ts --max-warnings 0

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Security audit (warn only on PR)
        run: npm audit --audit-level=high || echo "⚠️ Audit warnings (non-blocking on PR)"

  deploy-preview:
    name: Deploy Worker Preview
    runs-on: ubuntu-latest
    needs: quality-gate
    defaults:
      run:
        working-directory: ./mastercelular-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mastercelular-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Deploy Preview to Cloudflare Workers
        id: wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: ./mastercelular-api
          environment: preview
          vars: |
            ENVIRONMENT=preview
            FRONTEND_URL=https://${{ github.event.pull_request.number }}.mastercelular-frontend-preview.pages.dev

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.wrangler.outputs.url }}' || 'https://mastercelular-api-preview.<your-subdomain>.workers.dev';
            const body = `🚀 **Backend Preview Deployment Ready**\n\nAPI preview: ${url}\nHealth check: ${url}/health\n\n*This preview will update automatically on new commits to this PR.*`;
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });