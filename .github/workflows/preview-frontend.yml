name: Preview Deploy Frontend (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'cliente/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  PROJECT_NAME: mastercelular-frontend-preview

jobs:
  quality-gate:
    name: Quality Gate (Build Verification)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cliente

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cliente/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build frontend
        run: node build.js

      - name: Verify dist/ exists and has content
        run: |
          ls -la dist/
          test -f dist/index.html || (echo "❌ index.html not found in dist/" && exit 1)
          echo "✅ Build verification passed"

  deploy-preview:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest
    needs: quality-gate
    defaults:
      run:
        working-directory: ./cliente

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cliente/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build frontend
        run: node build.js

      - name: Deploy Preview to Cloudflare Pages
        id: pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ env.PROJECT_NAME }}
          directory: ./cliente/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: preview-${{ github.event.pull_request.number }}
          wranglerVersion: '3'

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.pages.outputs.url }}';
            const body = `🚀 **Frontend Preview Deployment Ready**\n\nFrontend preview: ${url}\n\n*This preview will update automatically on new commits to this PR.*`;
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });